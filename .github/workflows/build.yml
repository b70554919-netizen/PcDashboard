name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore -r win-x64

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish self-contained
        run: dotnet publish -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PcDashboard.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PcDashboard-installer
          path: dist/PcDashboard-Setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: PcDashboard-installer
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PcDashboard-Setup-*.exe
          generate_release_notes: true
